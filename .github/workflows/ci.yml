name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run vitests
        run: npm run test -- --coverage

  styles:
      name: Styles
      runs-on: ubuntu-latest

      steps:
        - name: Check out code
          uses: actions/checkout@v6

        - name: Set up Node
          uses: actions/setup-node@v5
          with:
            node-version: 22

        - name: Install dependencies
          run: npm ci

        - name: Prettier check
          run: npm run format:check

        # - name: Prettier write
        #   run: npm run format:write
