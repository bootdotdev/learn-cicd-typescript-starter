name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
  style:
    name: Style
    runs-on: ubuntu-latest


    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check
      
      - name: Lint
        run: npm run lint -- --max-warnings=0
