name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Node
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --coverage

  style:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check Node
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Formatting Checks
        run: npm run format:check
