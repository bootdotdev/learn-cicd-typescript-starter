name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Running the unit test suite
        run: npm run test -- --coverage
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses:  actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
            node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Running formatting styles
        run: npm run format:check
