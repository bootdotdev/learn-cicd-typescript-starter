name: ci
on:
  push:
    branches: [main, addtests]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Check Formatting
        run: npm run format:check
