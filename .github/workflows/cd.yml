name: Continuous Deployment

on:
  push:
    branches: ["*"]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run database migrations
        run: npm run db:migrate

      # خطوة وهمية إذا ما عندك صلاحيات Artifact Registry
      - name: Fake GCP build
        run: echo "Skipping gcloud build (no permissions)"

      # خطوة نشر التطبيق على Cloud Run
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-490023/notely-ar-repo/notely:v1 --region us-central1 --allow-unauthenticated --project notely-490023 --max-instances=4