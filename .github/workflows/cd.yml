name: Continuous Deployment

on:
  push:
    branches: ["*"]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run database migrations
        run: npm run db:migrate

      # هذه الخطوة الجديدة بدل gcloud
      - name: Fake GCP build
        run: echo "gcloud builds submit --tag REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/IMAGE:TAG ."

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely \
             --image us-central1-docker.pkg.dev/PROJECT_ID/REPO_NAME/IMAGE:TAG \
             --region us-central1 \
             --allow-unauthenticated \
             --project PROJECT_ID \
             --max-instances=4  