name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push Docker image to Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/smartbabe-f0cfd/notely-ar-repo/dolinh199x/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/smartbabe-f0cfd/notely-ar-repo/dolinh199x/notely:latest --region us-central1 --allow-unauthenticated --project smartbabe-f0cfd --max-instances=4
