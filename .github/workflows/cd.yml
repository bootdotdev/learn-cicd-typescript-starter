on:
  push:
    branches: [main]

  job:
    deploy:
      name: Deploy
      runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
      
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build