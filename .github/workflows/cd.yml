name: Continuous Deployment

on:
  push:
    branches: ["*"]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run database migrations
        run: npm run db:migrate

      # هذه الخطوة الجديدة بدل gcloud
      - name: Build Docker image (skipped for Render)
        run: echo "Using Render for automated builds instead of GCP"