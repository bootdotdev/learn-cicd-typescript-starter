name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy-Notely-App:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node env
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i

      - name: Run the build
        run: npm run build
